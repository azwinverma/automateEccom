# Local development stack. `docker compose up --build`
# API http://localhost:8000  ·  Web http://localhost:3000  ·  MinIO console http://localhost:9001
name: commerce-os

x-backend-env: &backend-env
  COS_ENVIRONMENT: development
  COS_DATABASE_URL: postgresql+psycopg://commerce:commerce@postgres:5432/commerce_os
  COS_REDIS_URL: redis://redis:6379/0
  COS_JWT_SECRET: dev-only-change-me-dev-only-change-me
  COS_CORS_ORIGINS: '["http://localhost:3000"]'
  COS_STORAGE_BACKEND: local
  COS_LOG_JSON: "true"

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce
      POSTGRES_DB: commerce_os
    ports: ["${PG_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d commerce_os"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.2.7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: commerce
      MINIO_ROOT_PASSWORD: commerce-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  migrate:
    build: { context: ./apps/backend, additional_contexts: { contracts: ./packages/contracts } }
    environment: *backend-env
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli seed-plans"]
    depends_on: { postgres: { condition: service_healthy } }

  api:
    build: { context: ./apps/backend, additional_contexts: { contracts: ./packages/contracts } }
    environment: *backend-env
    volumes: [objects:/app/.data]  # local object storage must be shared with the worker
    ports: ["${API_PORT:-8000}:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    build: { context: ./apps/backend, additional_contexts: { contracts: ./packages/contracts } }
    environment: *backend-env
    volumes: [objects:/app/.data]
    command: ["celery", "-A", "app.worker.celery_app:celery", "worker", "-Q", "default,outbox,ai,media", "--concurrency", "4", "--loglevel", "INFO"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  beat:
    build: { context: ./apps/backend, additional_contexts: { contracts: ./packages/contracts } }
    environment: *backend-env
    command: ["celery", "-A", "app.worker.celery_app:celery", "beat", "--loglevel", "INFO", "--schedule", "/tmp/celerybeat-schedule"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      BACKEND_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]
    profiles: ["web"]

volumes:
  pgdata:
  objects:
  miniodata:
