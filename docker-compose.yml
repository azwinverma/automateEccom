# Local development stack. `docker compose up --build`
# API http://localhost:8000  ·  Web http://localhost:3000  ·  MinIO console http://localhost:9001
# Every host port is overridable (API_PORT, WEB_PORT, PG_PORT, REDIS_PORT, MINIO_PORT, MINIO_CONSOLE_PORT,
# PROMETHEUS_PORT, GRAFANA_PORT) so the stack can run next to other projects.
# Profiles: `web` (Next.js), `observability` (Prometheus + Grafana with Nivaro alerts and dashboards).
# Object storage: COS_STORAGE_BACKEND=s3 uses the bundled MinIO (bucket created by `minio-init`).
name: commerce-os

x-backend-env: &backend-env
  COS_ENVIRONMENT: development
  COS_DATABASE_URL: postgresql+psycopg://commerce:commerce@postgres:5432/commerce_os
  COS_REDIS_URL: redis://redis:6379/0
  COS_JWT_SECRET: dev-only-change-me-dev-only-change-me
  COS_CORS_ORIGINS: '["http://localhost:3000"]'
  COS_STORAGE_BACKEND: ${COS_STORAGE_BACKEND:-local}
  COS_S3_ENDPOINT_URL: http://minio:9000
  COS_S3_PUBLIC_ENDPOINT_URL: http://localhost:${MINIO_PORT:-9000}  # presigned URLs for the browser
  COS_S3_BUCKET: nivaro-private
  COS_S3_ACCESS_KEY_ID: commerce
  COS_S3_SECRET_ACCESS_KEY: commerce-dev-secret
  COS_S3_SSE: none  # local MinIO has no KMS; production uses AES256/aws:kms or bucket default encryption
  COS_LOG_JSON: "true"

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce
      POSTGRES_DB: commerce_os
    ports: ["${PG_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d commerce_os"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.2.7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    # MinIO's own images are no longer published on Docker Hub/quay for anonymous pulls; this is the same
    # MinIO server release packaged by Bitnami (legacy repo, pinned).
    image: bitnamilegacy/minio:2025.4.22
    environment:
      MINIO_ROOT_USER: commerce
      MINIO_ROOT_PASSWORD: commerce-dev-secret
      MINIO_CONSOLE_PORT_NUMBER: "9001"
    ports: ["${MINIO_PORT:-9000}:9000", "${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: [miniodata:/bitnami/minio/data]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 20

  minio-init:  # private bucket with versioning (specs/16 DR: object storage versioning)
    image: bitnamilegacy/minio:2025.4.22
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: ["sh", "-c", "mc alias set local http://minio:9000 commerce commerce-dev-secret && mc mb -p local/nivaro-private && mc version enable local/nivaro-private && mc anonymous set none local/nivaro-private"]

  migrate:
    build: { context: ./apps/backend, additional_contexts: { contracts: ./packages/contracts } }
    environment: *backend-env
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli seed-plans"]
    depends_on: { postgres: { condition: service_healthy } }

  api:
    build: { context: ./apps/backend, additional_contexts: { contracts: ./packages/contracts } }
    environment: *backend-env
    volumes: [objects:/app/.data]  # local object storage must be shared with the worker
    ports: ["${API_PORT:-8000}:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  worker:
    build: { context: ./apps/backend, additional_contexts: { contracts: ./packages/contracts } }
    environment:
      <<: *backend-env
      COS_WORKER_METRICS_PORT: "9100"
      PROMETHEUS_MULTIPROC_DIR: /tmp/prom
    volumes: [objects:/app/.data]
    command: ["sh", "-c", "rm -rf /tmp/prom && mkdir -p /tmp/prom && exec celery -A app.worker.celery_app:celery worker -Q default,outbox,ai,media --concurrency 4 --loglevel INFO"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  beat:
    build: { context: ./apps/backend, additional_contexts: { contracts: ./packages/contracts } }
    environment: *backend-env
    command: ["celery", "-A", "app.worker.celery_app:celery", "beat", "--loglevel", "INFO", "--schedule", "/tmp/celerybeat-schedule"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      BACKEND_URL: http://api:8000
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on: [api]
    profiles: ["web"]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]
    depends_on: [api, worker]
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-nivaro-dev-only}
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_PORT:-3001}:3000"]
    depends_on: [prometheus]
    profiles: ["observability"]

volumes:
  pgdata:
  objects:
  miniodata:
