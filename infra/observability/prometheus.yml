# Prometheus for Nivaro (staging/production). Scrapes the API (operational gauges are computed on scrape)
# and the Celery workers (COS_WORKER_METRICS_PORT). Keep scrape targets on the private network.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: nivaro-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]  # one entry per API instance
  - job_name: nivaro-worker
    static_configs:
      - targets: ["worker:9100"]  # COS_WORKER_METRICS_PORT=9100
