name: commerce_os_seller
description: "Nivaro seller app (Autonomous Commerce OS) for Nepal social-commerce sellers."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.7.2
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  connectivity_plus: 6.1.4
  cross_file: 0.3.5
  dio: 5.8.0+1
  flutter_riverpod: 2.6.1
  flutter_secure_storage: 9.2.4
  go_router: 14.8.1
  image_picker: 1.2.1
  intl: 0.19.0
  path_provider: 2.1.5
  shared_preferences: 2.5.3
  uuid: 4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
  mocktail: 1.0.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansDevanagari-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansDevanagari-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700
